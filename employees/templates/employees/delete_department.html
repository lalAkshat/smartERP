<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Department - SmartERP</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 100px auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 30px;
            color: #555;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button,
        a {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        button {
            background: #dc3545;
            color: white;
        }

        .cancel {
            background: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Delete Department</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ department.name }}</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="buttons">

                <button type="submit">
                    Yes, Delete
                </button>

                <a href="{% url 'department_list' %}" class="cancel">
                    Cancel
                </a>

            </div>
        </form>

    </div>

</div>

</body>
</html>
