<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Department - SmartERP</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .error {
            background: #ffe5e5;
            color: #dc3545;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0d8df5;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button {
            background: #0d8df5;
            color: white;
        }

        button:hover {
            background: #066dcc;
        }

        .cancel {
            background: #6c757d;
            color: white;
        }

        .cancel:hover {
            background: #5a6268;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Add Department</h1>

        <p class="subtitle">
            Create a new department for your company.
        </p>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <label>
                Department Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter department name"
                required
            >


            <div class="buttons">

                <button type="submit">
                    + Add Department
                </button>

                <a
                    href="{% url 'department_list' %}"
                    class="cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
