<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Employee - SmartERP</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 100px auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #dc3545;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #555;
        }

        .employee-name {
            font-weight: bold;
            color: #222;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button,
        a {
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Delete Employee</h1>

        <p>
            Are you sure you want to delete
            <span class="employee-name">
                {{ employee.name }}
            </span>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="buttons">

                <button type="submit" class="delete-btn">
                    Yes, Delete
                </button>

                <a href="{% url 'employee_list' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
