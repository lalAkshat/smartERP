<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee - SmartERP</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 45px;
            padding-left: 15px;
        }

        .logo span {
            color: #00bcd4;
        }

        .menu-title {
            font-size: 12px;
            color: #9ca3af;
            margin: 0 0 15px 15px;
            text-transform: uppercase;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #d1d5db;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 15px;
        }

        .menu a:hover {
            background: #1f2937;
            color: white;
        }

        .menu a.active {
            background: #2563eb;
            color: white;
        }

        .logout-btn {
            background: #dc3545 !important;
            color: white !important;
            margin-top: 25px;
        }

        .logout-btn:hover {
            background: #b02a37 !important;
        }

        /* ================= MAIN ================= */

        .main {
            margin-left: 240px;
            min-height: 100vh;
        }

        .topbar {
            height: 75px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .topbar h2 {
            font-size: 24px;
        }

        .admin {
            color: #6b7280;
            font-size: 14px;
        }

        /* ================= CONTENT ================= */

        .content {
            padding: 35px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
        }

        /* ================= FORM CARD ================= */

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            max-width: 800px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .help-text {
            display: block;
            margin-top: 6px;
            color: #6b7280;
            font-size: 12px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }

        .update-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #157347;
        }

        .cancel-btn {
            flex: 1;
            padding: 14px;
            border-radius: 7px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #5c636a;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 200px;
            }

            .main {
                margin-left: 200px;
            }

        }

        @media (max-width: 650px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
            }

            .content {
                padding: 20px;
            }

            .topbar {
                padding: 0 20px;
            }

            .form-card {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="logo">
            Smart<span>ERP</span>
        </div>

        <div class="menu-title">
            Main Menu
        </div>

        <div class="menu">

            <a href="{% url 'dashboard' %}">
                🏠 Dashboard
            </a>

            <a href="{% url 'employee_list' %}"
               class="active">
                👥 Employees
            </a>

            <a href="{% url 'department_list' %}">
                📁 Departments
            </a>

            <a href="{% url 'salary_list' %}">
                💰 Salary
            </a>

            <a href="{% url 'reports' %}">
                📊 Reports
            </a>

            <a href="{% url 'ai_assistant' %}">
                🤖 AI Assistant
            </a>

            <a href="{% url 'logout' %}"
               class="logout-btn">
                🚪 Logout
            </a>

        </div>

    </div>


    <!-- ================= MAIN ================= -->

    <div class="main">


        <!-- TOPBAR -->

        <div class="topbar">

            <h2>
                Edit Employee
            </h2>

            <div class="admin">
                Welcome, {{ request.user.username }} 👋
            </div>

        </div>


        <!-- CONTENT -->

        <div class="content">


            <div class="page-header">

                <h1>
                    Edit Employee
                </h1>

                <p>
                    Update the employee's information below.
                </p>

            </div>


            <!-- FORM -->

            <div class="form-card">

                <form method="POST">

                    {% csrf_token %}


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Employee Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            value="{{ employee.name }}"
                            placeholder="Enter employee name"
                            required
                            minlength="2"
                            maxlength="100"
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            value="{{ employee.email }}"
                            placeholder="Enter email address"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            value="{{ employee.phone }}"
                            placeholder="Enter 10-digit phone number"
                            required
                            pattern="[0-9]{10}"
                            maxlength="10"
                            title="Please enter exactly 10 digits"
                        >

                        <span class="help-text">
                            Enter exactly 10 digits.
                        </span>

                    </div>


                    <!-- SALARY -->

                    <div class="form-group">

                        <label for="salary">
                            Salary
                        </label>

                        <input
                            type="number"
                            id="salary"
                            name="salary"
                            value="{{ employee.salary }}"
                            placeholder="Enter salary"
                            required
                            min="1"
                            step="0.01"
                        >

                    </div>


                    <!-- DEPARTMENT -->

                    <div class="form-group">

                        <label for="department">
                            Department
                        </label>

                        <select
                            id="department"
                            name="department"
                            required
                        >

                            <option value="">
                                Select Department
                            </option>

                            {% for department in departments %}

                            <option
                                value="{{ department.id }}"
                                {% if employee.department.id == department.id %}
                                    selected
                                {% endif %}
                            >
                                {{ department.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- BUTTONS -->

                    <div class="buttons">

                        <button
                            type="submit"
                            class="update-btn"
                        >
                            ✓ Update Employee
                        </button>

                        <a
                            href="{% url 'employee_list' %}"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>


</body>

</html>
